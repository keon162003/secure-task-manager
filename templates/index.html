<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SecureTask</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            padding: 50px 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        form {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #222;
            color: white;
        }

        button:hover {
            opacity: 0.8;
        }

        .tasks {
            margin-top: 30px;
        }

        li {
            margin: 12px 0;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 6px;
        }

        .health {
            margin-top: 30px;
            padding: 12px;
            background: #e8f7e8;
            color: green;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>SecureTask</h1>

        <p class="subtitle">
            Automated CI/CD Demonstration Application
        </p>

        <form action="/add" method="POST">

            <input
                type="text"
                name="title"
                placeholder="Enter a new task"
                required
            >

            <button type="submit">
                Add Task
            </button>

        </form>

        <div class="tasks">

            <h2>Tasks</h2>

            <ul>
                {% for task in tasks %}
                    <li>{{ task.title }}</li>
                {% endfor %}
            </ul>

        </div>

        <div class="health">
            ● Application health endpoint available
        </div>

    </div>

</body>
</html>
