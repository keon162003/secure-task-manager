
name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests with coverage
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=85

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and scanners
        run: python -m pip install -r requirements.txt bandit pip-audit

      - name: Run Bandit
        run: bandit -q -r app.py -ll

      - name: Audit dependencies
        run: pip-audit -r requirements.txt

  container:
    needs: [test, security]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and start with Compose
        run: docker compose up --build --detach

      - name: Wait before health check
        run: sleep 5

      - name: Check application health
        run: curl --verbose --fail --retry 10 --retry-connrefused --retry-delay 2 http://localhost:5000/health

      - name: Show container diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color

      - name: Stop Compose services
        if: always()
        run: docker compose down --volumes
