services:
  securetask:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - securetask-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:5000/health', timeout=2)"
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  securetask-data: